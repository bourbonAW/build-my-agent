[project]
name = "flywheel"
version = "0.1.0"
description = "Lean eval flywheel: identity, metrics, judge, regression, reports"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
judge = ["httpx>=0.27", "anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Only needed for the pipeline router's sample/promote/label-status endpoints;
# api.serve's _make_langfuse() already degrades gracefully when this extra
# isn't installed, so it's kept separate rather than a hard `api` dependency.
langfuse = ["langfuse>=2.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flywheel", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true

# bourbon (parent repo) and langfuse (evidence store) are external to this
# package and intentionally not installed in the flywheel venv; the Task 6 glue
# imports them lazily inside functions. Treat their missing stubs as untyped
# rather than letting strict import-not-found mask real type debt in scripts/.
[[tool.mypy.overrides]]
module = ["bourbon.*", "langfuse", "langfuse.*"]
ignore_missing_imports = true
