[project]
name = "flywheel"
version = "0.1.0"
description = "Lean eval flywheel: identity, metrics, judge, regression, reports"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
judge = ["httpx>=0.27", "anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flywheel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
